[DEFAULT]
# Standard oslo.log options. When log_dir is set each command logs to
# <log_dir>/<command>.log, e.g. nectar-metrics-nova.log.
log_dir = .
#debug = true

[metrics]
working_dir=.

[service_auth]
auth_type = password
auth_url = https://localhost:5000/v3
username = username
password = secret
project_name = project
user_domain_id = default
project_domain_id = default

[gnocchi]
archive_policy = stats

[victoria]
url = http://victoriametrics:8428

[sentry]
# GlitchTip/Sentry compatible DSN. When set, unhandled exceptions and
# ERROR level log messages are reported.
#dsn = https://key@glitchtip.example.com/1
#environment = production
